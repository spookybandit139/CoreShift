<!doctype html><html><head><meta charset="UTF-8"><style>body{margin:0;background:transparent;overflow:hidden}.cross{--c:#b7ff35;--s:28px;--t:3px;--g:6px;position:absolute;inset:0;filter:drop-shadow(0 0 6px var(--c))}.cross>*{position:absolute;display:block;background:var(--c);border-radius:4px}.cross i,.cross b{width:var(--t);height:var(--s);left:calc(50% - var(--t)/2)}.cross i{bottom:calc(50% + var(--g))}.cross b{top:calc(50% + var(--g))}.cross em,.cross strong{height:var(--t);width:var(--s);top:calc(50% - var(--t)/2)}.cross em{right:calc(50% + var(--g))}.cross strong{left:calc(50% + var(--g))}.dot>*{display:none}.dot:after{content:"";position:absolute;left:calc(50% - var(--t)/2);top:calc(50% - var(--t)/2);width:var(--t);height:var(--t);border-radius:50%;background:var(--c)}.crossshape i,.crossshape b{display:none}</style></head><body><div id="cross" class="cross"><i></i><b></b><em></em><strong></strong></div><script>window.coreShiftAPI.onCrosshairPreset(function(p){const n=document.getElementById('cross');n.className='cross '+(p.shape==='cross'?'crossshape':p.shape);n.style.setProperty('--c',p.color);n.style.setProperty('--s',p.size+'px');n.style.setProperty('--t',p.thickness+'px');n.style.setProperty('--g',p.gap+'px')})</script></body></html>
