<!doctype html><html><head><meta charset="UTF-8"><style>body{margin:0;background:transparent;font-family:Segoe UI,sans-serif;color:#eaffbb}.box{background:#10150de8;border:1px solid #b7ff35;border-radius:8px;padding:7px 11px;width:98px;box-shadow:0 4px 20px #0008}.fps{font-weight:800;font-size:20px;line-height:1}.fps span{font-size:9px;color:#b7ff35;letter-spacing:1px}.meta{margin-top:4px;font-size:8px;color:#c3cbb8;letter-spacing:.5px}</style></head><body><div class="box"><div class="fps" id="fps">-- <span>FPS</span></div><div class="meta" id="meta">CoreShift Overlay</div></div><script>window.coreShiftAPI.onOverlayStats(function(s){document.getElementById('fps').innerHTML=s.fps+' <span>FPS</span>';document.getElementById('meta').textContent='CPU '+s.cpu+'% · RAM '+s.ram+'%'})</script></body></html>
